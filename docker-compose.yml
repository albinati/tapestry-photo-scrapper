# Production deploy on a Docker host (e.g. Hetzner).
#
# Host layout (assumed):
#   /srv/tapestry/
#     ├── .env           — Tapestry login (TAPESTRY_EMAIL / TAPESTRY_PASSWORD)
#     ├── config.toml    — children, school slug, family-author skip list,
#     │                    google_photos.credentials_path / token_path
#     │                    (paths inside the container, e.g. /secrets/...)
#     └── data/          — runtime: state.json, scrape_summary.json,
#                          tapestry-photos/<child>/, tapestry-diary/<child>/
#
# Adjust the two OAuth bind mounts below to wherever your Google
# credentials live on the host. The token directory must be writable
# (the uploader rotates the access_token in place).
#
# Trigger a run:
#   docker exec tapestry bash /app/run_all.sh

services:
  tapestry:
    image: ghcr.io/albinati/tapestry-photo-scrapper:main
    container_name: tapestry
    restart: unless-stopped
    user: "1001:1001"
    volumes:
      - /srv/tapestry/.env:/app/.env:ro
      - /srv/tapestry/config.toml:/app/config.toml:ro
      - /srv/tapestry/data:/app/data
      # Google authorized-user token, owned and refreshed by another
      # process (e.g. an OpenClaw weekly cron). Read-only — we never
      # write to it, just consume it via google-auth's
      # Credentials.from_authorized_user_file(). Adjust the host path
      # to wherever your token lives.
      - /root/.openclaw/workspace/credentials/gmail-token.json:/secrets/openclaw/gmail-token.json:ro
    environment:
      - TZ=Europe/London
